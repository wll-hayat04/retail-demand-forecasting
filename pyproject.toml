[project]
name = "retail-demand-forecasting"
version = "0.1.0"
description = "Experimental study of retail demand forecasting, robustness and predictive uncertainty"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pandas>=2.2,<3",
    "numpy>=1.24,<2.4",
    "scikit-learn>=1.6,<2",
    "xgboost>=2,<4",
    "matplotlib>=3.7,<4",
    "seaborn>=0.12,<1",
    "openpyxl>=3.1,<4",
    "statsmodels>=0.14,<1",
]

[project.optional-dependencies]
notebooks = [
    "ipykernel>=6",
    "nbformat>=5",
]
test = [
    "pytest>=8,<10",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]